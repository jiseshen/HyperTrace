[project]
name = "hypertrace-mcp"
version = "0.1.0"
description = "Local hypothesis memory for coding agents"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2"]

[project.scripts]
hypertrace-mcp = "hypertrace_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypertrace_mcp"]
